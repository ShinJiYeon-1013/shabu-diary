<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="샤브 일지">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E3EAE8">
<link rel="apple-touch-icon" href="icon.png">
<title>샤브 일지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --tile:#E3EAE8; --tile-line:#D3DDDA;
  --ink:#2B2A33; --sub:#6E6C75;
  --wood:#A8744B; --wood-in:#FCF5EA;
  --green:#2F7A45; --chili:#C93A2B; --paper:#FFFFFF;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  color:var(--ink);font-size:15px;line-height:1.5;
  background:var(--tile);
  background-image:linear-gradient(var(--tile-line) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--tile-line) 1.5px,transparent 1.5px);
  background-size:46px 46px;
}
.hand{font-family:"Gaegu","Apple SD Gothic Neo",sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--green);outline-offset:2px;border-radius:8px}

.app{max-width:480px;margin:0 auto;min-height:100dvh;padding:0 16px calc(110px + env(safe-area-inset-bottom));}
header{position:sticky;top:0;z-index:5;height:58px;display:flex;align-items:center;justify-content:space-between;
  background:rgba(227,234,232,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);margin:0 -16px;padding:0 16px}
.brand{font-size:28px;font-weight:700;letter-spacing:-.5px;display:flex;align-items:center;gap:6px}
.back{font-size:15px;font-weight:600;padding:8px 10px 8px 2px;display:flex;align-items:center;gap:2px}
.back svg{width:20px;height:20px}

/* ---------- calendar ---------- */
.sheet{background:var(--paper);border:2.5px solid var(--ink);border-radius:18px 14px 20px 15px;padding:14px 12px 16px;position:relative;margin-top:14px}
.sheet::before{content:"";position:absolute;top:-12px;left:50%;width:82px;height:22px;transform:translateX(-50%) rotate(-3deg);background:rgba(240,214,120,.75);border-radius:3px}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 10px}
.cal-head h2{font-size:30px;font-weight:700;line-height:1}
.nav{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--ink)}
.nav svg{width:18px;height:18px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.dow span{text-align:center;font-size:12px;color:var(--sub);padding-bottom:6px}
.dow span:first-child{color:var(--chili)}
.day{aspect-ratio:1/1.12;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:3px;border-radius:12px;position:relative}
.day .n{font-size:13px;font-weight:600;line-height:1.2}
.day.sun .n{color:var(--chili)}
.day.today .n{background:var(--ink);color:#fff;border-radius:10px;padding:0 6px}
.day.has{background:#FBF1E2}
.day .mini{width:88%;max-width:46px;margin-top:2px}
.day.blank{pointer-events:none}
.month-note{font-size:21px;text-align:center;margin:18px 0 4px}
.month-note b{color:var(--chili)}
.fav{text-align:center;color:var(--sub);font-size:13px}

/* ---------- pot ---------- */
.pot-wrap{display:flex;justify-content:center;margin-top:4px}
.pot{width:100%;max-width:360px;height:auto;overflow:visible}
.broth-name{text-align:center;font-size:19px;margin-top:-4px;color:var(--sub)}
.bob{transform-box:fill-box;transform-origin:center;animation:bob 3.2s ease-in-out infinite}
.drop{transform-box:fill-box;transform-origin:center;animation:drop .55s cubic-bezier(.3,1.5,.5,1)}
.bub{transform-box:fill-box;transform-origin:center;animation:bub 2.6s ease-out infinite;opacity:0}
.steam{animation:steam 4.5s ease-in-out infinite;opacity:0}
@keyframes bob{50%{transform:translate(0,-2.5px) rotate(4deg)}}
@keyframes drop{0%{transform:translateY(-60px) scale(1.6);opacity:0}100%{transform:none;opacity:1}}
@keyframes bub{0%{transform:scale(.2);opacity:0}25%{opacity:.95}100%{transform:scale(1.35);opacity:0}}
@keyframes steam{0%{transform:translateY(14px);opacity:0}40%{opacity:.7}100%{transform:translateY(-26px);opacity:0}}

/* ---------- date row ---------- */
.date-row{display:flex;align-items:center;justify-content:space-between;margin:12px 2px 0}
.date-title{font-size:30px;font-weight:700;line-height:1.1;position:relative}
.date-title input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.date-title small{font-size:15px;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;font-weight:500;color:var(--sub);margin-left:4px}
.hint{font-size:12.5px;color:var(--sub);background:#fff;border:1.5px solid #CFC9BF;border-radius:20px;padding:3px 10px;white-space:nowrap}

/* ---------- tray ---------- */
.tray{margin-top:10px;border:4px solid var(--wood);background:var(--wood-in);border-radius:30px 22px 34px 20px;padding:10px 8px 14px}
.row{padding:4px 0}
.row + .row{border-top:1.5px dashed #E4D3BC}
.row-name{font-size:17px;color:var(--wood);padding:2px 8px 0;font-weight:700}
.cells{display:flex;flex-wrap:wrap}
.ing{width:33.333%;display:flex;flex-direction:column;align-items:center;padding:4px 2px 6px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;position:relative}
.ing svg{width:84px;height:84px;transition:transform .5s ease}
.ing .lbl{font-size:12.5px;line-height:1.25;text-align:center;color:var(--ink);min-height:16px}
.ing .lbl b{color:var(--chili);font-weight:800}
.ing.off .lbl{color:#A39C91}
.ing.pressing svg{transform:scale(.82)}
.ing.lifted{opacity:.3}
.row{transition:background .15s}
.row.drop{background:rgba(47,122,69,.14);border-radius:18px;box-shadow:inset 0 0 0 2.5px var(--green)}
.ghost{position:fixed;left:0;top:0;width:80px;height:80px;z-index:30;pointer-events:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
.ghost svg{width:100%;height:100%;transform:scale(1.12)}
body.dragging{user-select:none;-webkit-user-select:none}
.ing.pop svg{animation:pop .35s ease}
.ing.shake svg{animation:shake .35s ease}
@keyframes pop{40%{transform:scale(1.14)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.ing.off svg *{fill:transparent!important;stroke:#BDB5A8!important}
.ing.off svg .in{stroke:var(--wood-in)!important}
.ing.off svg .d{stroke:#DDD5C8!important}

/* ---------- view switch ---------- */
.seg{display:flex;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:3px;margin-top:14px}
.seg button{flex:1;padding:8px 0;border-radius:10px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.opt{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:10px;font-size:13px;color:var(--sub)}
.chip{border:1.5px solid #C9C2B7;border-radius:20px;padding:3px 11px;background:#fff;font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}

/* ---------- text view ---------- */
.textlist{margin-top:10px;background:#fff;border:2.5px solid var(--ink);border-radius:16px 20px 15px 18px;padding:6px 18px 14px}
.textlist h3{font-size:20px;color:var(--wood);margin-top:10px;font-weight:700}
.textlist ul{list-style:none}
.textlist li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #EEE9E1}
.textlist li:last-child{border-bottom:0}
.textlist li span:last-child{font-weight:700}
.textlist .sum{font-size:13px;color:var(--sub);padding-top:8px}

/* ---------- bottom bar ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:12px 16px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(rgba(227,234,232,0),rgba(227,234,232,.95) 30%)}
.bar-in{max-width:448px;margin:0 auto;display:flex;gap:8px}
.btn{flex:1;height:54px;border-radius:16px;font-size:17px;font-weight:700;border:2.5px solid var(--ink);background:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--green);color:#fff}
.btn.primary:disabled{background:#B8C2BC;border-color:#9AA49E;color:#F3F5F4;cursor:default}
.btn.danger{flex:0 0 auto;padding:0 18px;color:var(--chili);border-color:var(--chili)}
.btn.danger.armed{background:var(--chili);color:#fff;flex:1}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:9;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- login ---------- */
.hdr-btn{font-size:13px;color:var(--sub);border:1.5px solid #C9C2B7;border-radius:20px;padding:4px 12px;background:#fff}
.login{margin-top:24px;background:var(--paper);border:2.5px solid var(--ink);border-radius:18px 14px 20px 15px;padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.login-lead{font-size:24px;text-align:center}
.login label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.login input{font:inherit;font-size:16px;height:48px;border:2px solid var(--ink);border-radius:12px;padding:0 12px;background:#fff;color:var(--ink)}
.login-err{min-height:20px;font-size:14px;color:var(--chili)}
.link{font-size:14px;color:var(--sub);text-decoration:underline;align-self:center;padding:4px}
.msg{text-align:center;margin-top:60px;font-size:22px}

/* ---------- add / hide ingredient ---------- */
.ing.add .lbl{color:var(--wood)}
.tray-tip{text-align:center;font-size:12.5px;color:var(--sub);margin-top:8px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(43,42,51,.45);display:flex;align-items:flex-end;justify-content:center;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.modal[hidden]{display:none}
.modal-box{width:100%;max-width:448px;max-height:88dvh;overflow:auto;background:var(--wood-in);border:3px solid var(--ink);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.modal-box h3{font-size:26px;line-height:1.1}
.modal-box p{font-size:14.5px}
.fld{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.fld input{font:inherit;font-size:16px;height:48px;border:2px solid var(--ink);border-radius:12px;padding:0 12px;background:#fff;color:var(--ink);font-weight:400}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--wood-in),0 0 0 5.5px var(--ink)}
.prev{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600}
.prev svg{width:64px;height:64px}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--green)}
.modal-btns{display:flex;gap:8px}
.hid{border-top:1.5px dashed #E4D3BC;padding-top:10px;display:flex;flex-direction:column;gap:8px}
.move-row{display:flex;flex-wrap:wrap;gap:8px}
.move-row .chip{font-size:14px;padding:7px 14px}
.fld .sub{font-weight:400;color:var(--sub)}
.hid-row{display:flex;align-items:center;justify-content:space-between}

@media (min-width:600px){
  .app{padding-top:10px}
  .ing svg{width:96px;height:96px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .bub,.steam{opacity:.5}
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="bar" id="bar"></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal" hidden></div>

<script>
/* =========================================================
   재료 정의
   ========================================================= */
// 기본 재료 (사용자가 추가한 재료는 Firebase config/ingredients 에서 와서 applyIngredients() 로 합쳐짐)
const BASE_ING = [
  {k:'dashima', name:'다시마육수코인', label:'다시마 코인', cat:'육수', broth:'#C8BE80'},
  {k:'beef',    name:'소고기육수코인', label:'소고기 코인', cat:'육수', broth:'#B47246'},
  {k:'anchovy', name:'멸치육수코인',   label:'멸치 코인',   cat:'육수', broth:'#D7C597'},
  {k:'chadol',  name:'차돌박이',   label:'차돌박이',   cat:'고기', pot:1, c:'#C63D4A'},
  {k:'usam',    name:'우삼겹',     label:'우삼겹',     cat:'고기', pot:1, c:'#B8334A'},
  {k:'daepae',  name:'대패삼겹',   label:'대패삼겹',   cat:'고기', pot:1, c:'#F2A7A4'},
  {k:'enoki',   name:'팽이버섯',   label:'팽이버섯',   cat:'버섯', pot:1, c:'#EFE5C2'},
  {k:'oyster',  name:'느타리버섯', label:'느타리버섯', cat:'버섯', pot:1, c:'#8E8A86'},
  {k:'napa',    name:'알배추',     label:'알배추',     cat:'야채', pot:1, c:'#DDEB98'},
  {k:'sprout',  name:'숙주나물',   label:'숙주나물',   cat:'야채', pot:1, c:'#F4EFD8'},
  {k:'bokchoy', name:'청경채',     label:'청경채',     cat:'야채', pot:1, c:'#3F8A47'},
  {k:'sauce',   name:'베트남 친수소스', label:'친수소스', cat:'소스'},
  {k:'paper',   name:'라이스페이퍼', label:'라이스페이퍼', cat:'기타'},
  {k:'somen',   name:'소면',       label:'소면',       cat:'기타', pot:1, c:'#F6EFD6'},
];
const BASE_ROWS = [
  ['육수',['dashima','beef','anchovy']],
  ['고기',['chadol','usam','daepae']],
  ['버섯',['enoki','oyster']],
  ['야채',['napa','sprout','bokchoy']],
  ['소스와 곁들임',['sauce','paper','somen']],
];
const MAX = 3;
const SIDE_ROW = '소스와 곁들임';
const COLORS = ['#C63D4A','#F2A7A4','#E8A23A','#EAD45C','#DDEB98','#3F8A47','#F7F5EF','#EFE5C2','#9C5D37','#8E8A86','#4E6185'];

// 아래 값들은 기본 재료 + 추가한 재료로 매번 다시 계산됨
let ING, BY, ROWS, BROTH, POT_ING, SLOTS, HIDDEN = new Set();
function applyIngredients(cfg={}){
  const rowNames=BASE_ROWS.map(r=>r[0]);
  const moved=cfg.moved||{};  // {재료키: 옮긴 분류} — 추가할 때 고른 분류보다 우선
  const custom=(cfg.custom||[]).filter(i=>i&&/^x[0-9a-z]+$/.test(i.k))
    .map(i=>({...i,row:rowNames.includes(moved[i.k])?moved[i.k]:i.row}))
    .filter(i=>rowNames.includes(i.row)).map(customIng);
  ING=[...BASE_ING,...custom];
  BY=Object.fromEntries(ING.map(i=>[i.k,i]));
  ROWS=BASE_ROWS.map(([n,ks])=>[n,[...ks,...custom.filter(i=>i.row===n).map(i=>i.k)]]);
  HIDDEN=new Set((cfg.hidden||[]).filter(k=>BY[k]));
  BROTH=ING.filter(i=>i.broth).map(i=>i.k);
  POT_ING=ING.filter(i=>i.pot).map(i=>i.k);
  SLOTS=makeSlots(POT_ING.length*MAX);
}
// 추가한 재료: 분류가 육수면 육수 코인, 소스와 곁들임은 '냄비에 넣는 재료'일 때만 냄비에 그림
function customIng(i){
  const name=String(i.name||'').replace(/[<>&"']/g,'').trim().slice(0,10)||'재료';
  const c=/^#[0-9a-fA-F]{6}$/.test(i.c)?i.c:'#C9B79C';
  const o={k:i.k,name,label:name,row:i.row,cat:i.row===SIDE_ROW?'기타':i.row,custom:1};
  if(i.row==='육수')o.broth=c;else{o.c=c;if(i.row!==SIDE_ROW||i.pot!==false)o.pot=1}
  ART[o.k]=NAMED_ART[name]||genArt(o);
  return o;
}

/* =========================================================
   재료 그림 (viewBox 0 0 100 100)
   .d = 무늬, .in = 속 하이라이트(테두리 모드에서 숨김)
   ========================================================= */
function hatch(cx,cy,r,step,ang){
  let s='';const a=ang*Math.PI/180,dx=Math.cos(a),dy=Math.sin(a),nx=-dy,ny=dx;
  for(let o=-r+step/2;o<r;o+=step){const h=Math.sqrt(r*r-o*o),px=cx+nx*o,py=cy+ny*o;
    s+=`M${(px-dx*h).toFixed(1)} ${(py-dy*h).toFixed(1)}L${(px+dx*h).toFixed(1)} ${(py+dy*h).toFixed(1)}`}
  return s;
}
function coin(front,back,line,emblem){
  return `<circle cx="50" cy="57" r="31" fill="${back}" stroke="#3B342E"/>
  <circle cx="50" cy="50" r="31" fill="${front}" stroke="#3B342E"/>
  <circle class="d" cx="50" cy="50" r="24" stroke="${line}" stroke-width="1.6" stroke-dasharray="3 4"/>
  ${emblem}`;
}
function bokLeaf(rot,s){
  return `<g transform="rotate(${rot} 50 94) translate(50 94) scale(${s}) translate(-50 -94)">
    <path d="M44 94 C40 80 42 64 46 54 L54 54 C58 64 60 80 56 94Z" fill="#DCEFC4" stroke="#5F8E43"/>
    <path d="M50 10 C30 14 30 44 46 56 L54 56 C70 44 70 14 50 10Z" fill="#3F8A47" stroke="#22562A"/>
    <path class="d" d="M50 54 L50 20" stroke="#A2D08B" stroke-width="2"/>
  </g>`;
}
const ART = {
  dashima: coin('#76874E','#55623A','#C7D29A',
    `<g class="d" stroke="#DCE5B0" stroke-width="3"><path d="M40 35 Q34 42 40 50 T40 65"/><path d="M50 33 Q44 41 50 50 T50 67"/><path d="M60 35 Q54 42 60 50 T60 65"/></g>`),
  beef: coin('#9C5D37','#6C3D22','#E2B795',
    `<g class="d" stroke="#F4DCC7" stroke-width="2.6"><path d="M37 40 Q31 32 38 29"/><path d="M63 40 Q69 32 62 29"/><ellipse cx="50" cy="47" rx="13" ry="12"/><ellipse cx="50" cy="56" rx="8" ry="5"/></g>`),
  anchovy: coin('#9BA7B3','#6B7784','#D9E0E7',
    `<g class="d" stroke="#F4F7FA" stroke-width="2.6"><path d="M33 50 Q46 39 60 50 Q46 61 33 50Z"/><path d="M60 50 L69 43 L69 57Z"/><circle cx="40" cy="48.5" r="1.4"/></g>`),

  chadol: `<path d="M12 40 C20 24 44 22 58 27 C74 22 90 30 89 46 C92 62 80 74 60 73 C42 80 18 74 13 60 C9 53 10 46 12 40Z" fill="#C63D4A" stroke="#7E2330"/>
    <g class="d" stroke="#FFF1EC"><path d="M20 44 C32 36 44 46 54 40 S76 38 84 44" stroke-width="3.5"/><path d="M18 56 C30 50 40 60 56 54 S74 52 85 58" stroke-width="3"/><path d="M28 66 C38 62 50 68 64 64" stroke-width="2.5"/><path d="M36 32 C44 30 50 34 60 31" stroke-width="2.5"/></g>`,

  usam: `<g transform="rotate(-16 50 50)">
    <path d="M8 34 Q20 28 32 34 T56 34 T80 34 T94 32 L94 66 Q82 72 70 66 T46 66 T22 66 T8 68Z" fill="#B8334A" stroke="#6E1F2E"/>
    <g class="d" stroke="#FFEDE6"><path d="M11 44 Q22 39 34 44 T58 44 T82 44 T91 42" stroke-width="5"/><path d="M11 56 Q22 52 34 56 T58 56 T82 56 T91 55" stroke-width="3"/></g></g>`,

  daepae: `<g>
    <path d="M18 22 L62 22 A10 13 0 0 1 62 48 L18 48 A10 13 0 0 1 18 22Z" fill="#F2A7A4" stroke="#A85A5A"/>
    <g class="d" stroke="#FFF6F2" stroke-width="2.4"><path d="M28 23 Q26 35 28 47"/><path d="M40 23 Q38 35 40 47"/><path d="M51 23 Q49 35 51 47"/></g>
    <ellipse cx="62" cy="35" rx="10" ry="13" fill="#F8C9C3" stroke="#A85A5A"/>
    <path class="d" d="M62 35 m-2 0 a2 2.5 0 1 1 4 0 a4 5 0 1 1 -8 0 a6 8 0 1 1 12 0" stroke="#A85A5A" stroke-width="1.8"/>
  </g><g transform="translate(16 34)">

  const R=rng(7),perm=[...Array(N).keys()];for(let i=N-1;i>0;i--){const j=Math.floor(R()*(i+1));[perm[i],perm[j]]=[perm[j],perm[i]]}
  return perm.map(p=>out[p]);}

async function cloudInit(){
  const [{initializeApp},au,fs]=await Promise.all([import(FB+'firebase-app.js'),import(FB+'firebase-auth.js'),import(FB+'firebase-firestore.js')]);

    else{S.records={};applyIngredients();S.view='login'}

  const {collection,onSnapshot}=cloud.fs;
  cloud.unsub=onSnapshot(collection(cloud.db,'records'),snap=>{
    const r={};snap.forEach(d=>{r[d.id]=d.data()});
    S.records=r;refresh();
    if(!snap.metadata.fromCache)migrateLocal(r);
  },err=>{console.error(err);toast(err.code==='permission-denied'?'이 계정은 기록을 볼 수 없어요':'기록을 불러오지 못했어요')});

// 1단계 때 폰에만 저장했던 기록을 한 번 올림. 같은 날짜가 이미 있으면 올라가 있는 쪽을 그대로 둠.
// 폰의 기록은 지우지 않고 'shabu-records-backup'으로 이름만 바꿔 남겨둠.
async function migrateLocal(server){
  if(cloud.migrating)return;
  const local=await store.get('shabu-records');if(!local)return;
  cloud.migrating=true;
  const {doc,setDoc}=cloud.fs;
  const todo=Object.entries(local).filter(([k])=>!server[k]);
  try{
    await Promise.all(todo.map(([k,v])=>setDoc(doc(cloud.db,'records',k),{...v,by:S.user.email})));
    await store.set('shabu-records-backup',local);
    localStorage.removeItem('shabu-records');
    if(todo.length)toast(`이 폰에 있던 기록 ${todo.length}개를 올렸어요`);
  }catch(e){console.error(e)}
  finally{cloud.migrating=false}
}

  'auth/email-already-in-use':'이미 가입된 이메일이에요. 로그인을 눌러주세요',
  'auth/weak-password':'비밀번호는 6자 이상이어야 해요',
  'auth/too-many-requests':'너무 여러 번 시도했어요. 잠시 뒤에 다시 해주세요',
  'auth/network-request-failed':'인터넷 연결을 확인해 주세요',
  'auth/configuration-not-found':'Firebase에서 로그인 기능이 아직 켜지지 않았어요',
  'auth/operation-not-allowed':'Firebase에서 이메일/비밀번호 로그인이 꺼져 있어요',
};
async function authDo(kind){
  const email=$('#email').value.trim(),pw=$('#pw').value,err=$('#loginErr'),au=cloud.au;
  err.textContent='';
  if(!email){err.textContent='이메일을 적어주세요';return}
  try{
    if(kind==='reset'){await au.sendPasswordResetEmail(cloud.auth,email);err.textContent='비밀번호를 바꾸는 메일을 보냈어요. 메일함을 확인해 주세요';return}
    if(pw.length<6){err.textContent='비밀번호는 6자 이상이어야 해요';return}
    if(kind==='signup')await au.createUserWithEmailAndPassword(cloud.auth,email,pw);
    else await au.signInWithEmailAndPassword(cloud.auth,email,pw);
  }catch(e){console.error(e);err.textContent=AUTH_MSG[e.code]||`잠시 뒤에 다시 해주세요 (${e.code||e.message})`}
}

    ${top?`<p class="fav">제일 많이 넣은 재료는 ${BY[top[0]].name}</p>`:''}`;

function setCount(k,n,cell){
  const prev=S.draft[k]||0;
  if(n>MAX){n=0;toast(`${BY[k].label} 뺐어요`)}
  if(n)S.draft[k]=n;else delete S.draft[k];
  cell.className=`ing ${n?'on':'off'}`;cell.innerHTML=cellInner(k,n);
  cell.setAttribute('aria-label',`${BY[k].name} ${n}개`);
  void cell.offsetWidth;cell.classList.add('pop');
  $('#potWrap').innerHTML=potSVG(S.draft,n>prev?k:null);
  $('#brothName').textContent=brothName(S.draft);
  updateSaveBar();
}
function bindTray(){
  const tray=$('#tray');let pt=null;
  tray.addEventListener('contextmenu',e=>e.preventDefault());
  tray.addEventListener('pointerdown',e=>{
    const b=e.target.closest('.ing[data-k]');if(!b)return;
    try{b.setPointerCapture(e.pointerId)}catch(_){}
    pt={b,x:e.clientX,y:e.clientY,long:false,cancel:false};
    b.classList.add('pressing');
    pt.t=setTimeout(()=>{pt.long=true;b.classList.remove('pressing');const k=b.dataset.k;
      if(S.draft[k]){setCount(k,0,b);navigator.vibrate&&navigator.vibrate(30);toast(`${BY[k].label} 뺐어요`)}
      else if(BY[k].custom)dragStart(pt);   // 추가한 재료: 들어 올림 → 끌면 분류 옮기기, 그냥 떼면 창
      else openModal({type:'hide',k})},550);
  });
  tray.addEventListener('pointermove',e=>{if(!pt)return;
    if(pt.drag){dragMove(pt,e);return}
    if(!pt.cancel&&Math.hypot(e.clientX-pt.x,e.clientY-pt.y)>10){pt.cancel=true;clearTimeout(pt.t);pt.b.classList.remove('pressing')}});
  // 끄는 동안 화면이 스크롤되지 않게 (아이폰)
  tray.addEventListener('touchmove',e=>{if(pt&&pt.drag)e.preventDefault()},{passive:false});
  const end=e=>{if(!pt)return;clearTimeout(pt.t);pt.b.classList.remove('pressing');
    if(pt.drag)dragEnd(pt,e.type==='pointerup');
    else if(e.type==='pointerup'&&!pt.long&&!pt.cancel){const k=pt.b.dataset.k;setCount(k,(S.draft[k]||0)+1,pt.b)}
    pt=null};
  tray.addEventListener('pointerup',end);tray.addEventListener('pointercancel',end);tray.addEventListener('pointerleave',e=>{if(pt&&!pt.drag&&e.target===tray)end(e)});
  // 키보드: Enter/Space = +1, Delete/Backspace = 빼기
  tray.addEventListener('click',e=>{if(e.detail!==0)return;const b=e.target.closest('.ing[data-k]');if(b){const k=b.dataset.k;setCount(k,(S.draft[k]||0)+1,b)}});
  tray.addEventListener('keydown',e=>{const b=e.target.closest('.ing[data-k]');if(b&&(e.key==='Delete'||e.key==='Backspace')){e.preventDefault();setCount(b.dataset.k,0,b)}});
}

/* ---- 추가한 재료 끌어서 분류 옮기기 ---- */
function dragStart(pt){
  pt.drag=true;pt.moved=false;pt.from=rowOf(pt.b.dataset.k);
  navigator.vibrate&&navigator.vibrate(30);
  pt.b.classList.add('lifted');document.body.classList.add('dragging');
  pt.ghost=document.createElement('div');pt.ghost.className='ghost';
  pt.ghost.innerHTML=`<svg viewBox="0 0 100 100">${art(pt.b.dataset.k)}</svg>`;
  document.body.appendChild(pt.ghost);
  pt.cx=pt.x;pt.cy=pt.y;dragPaint(pt);
  // 손가락이 화면 위/아래 끝에 있으면 천천히 스크롤
  const loop=()=>{if(!pt.drag)return;const h=innerHeight;
    if(pt.cy<90)scrollBy(0,-10);else if(pt.cy>h-140)scrollBy(0,10);
    if(pt.moved)dragPaint(pt);requestAnimationFrame(loop)};
  requestAnimationFrame(loop);
}
function dragMove(pt,e){
  pt.cx=e.clientX;pt.cy=e.clientY;
  if(Math.hypot(pt.cx-pt.x,pt.cy-pt.y)>10)pt.moved=true;
  dragPaint(pt);
}
function dragPaint(pt){
  pt.ghost.style.transform=`translate(${pt.cx-40}px,${pt.cy-56}px)`;
  const el=document.elementFromPoint(pt.cx,pt.cy),row=el&&el.closest('.row[data-row]');
  pt.to=row?row.dataset.row:null;
  document.querySelectorAll('.row.drop').forEach(r=>{if(r!==row)r.classList.remove('drop')});
  if(row&&pt.to!==pt.from)row.classList.add('drop');
}
function dragEnd(pt,dropped){
  pt.drag=false;pt.ghost.remove();pt.b.classList.remove('lifted');document.body.classList.remove('dragging');
  document.querySelectorAll('.row.drop').forEach(r=>r.classList.remove('drop'));
  const k=pt.b.dataset.k;
  if(!dropped)return;
  if(!pt.moved){openModal({type:'hide',k});return}
  if(pt.to&&pt.to!==pt.from){cloudIng({moved:{[k]:pt.to}});toast(`${BY[k].label}, ${withRo(pt.to)} 옮겼어요`)}
}

/* ---- 재료 추가 / 숨기기 창 ---- */
const esc=v=>String(v).replace(/[&<>"']/g,c=>`&#${c.charCodeAt(0)};`);
function openModal(m){S.modal={...m,t:Date.now()};renderModal();if(m.type==='add')$('#ingName').focus()}
function closeModal(){S.modal=null;const el=$('#modal');el.hidden=true;el.innerHTML=''}
function renderModal(){
  const m=S.modal,el=$('#modal');el.hidden=false;
  if(m.type==='hide'){
    const i=BY[m.k],cur=rowOf(m.k);
    const move=i.custom?`<div class="fld">분류 옮기기 <span class="sub">(지금: ${cur})</span><div class="move-row">${BASE_ROWS.map(r=>r[0]).filter(r=>r!==cur)

    el.innerHTML=`<div class="modal-box" role="dialog" aria-modal="true" aria-label="${i.label} 관리">
      <h3 class="hand">${i.label}</h3>
      ${move}
      <p>목록에서 숨길 수도 있어요. 예전 기록에는 그대로 남아 있고, 나중에 ${cur}의 + 칸에서 다시 꺼낼 수 있어요.</p>
      <div class="modal-btns"><button class="btn" data-act="modal-close">취소</button><button class="btn primary" data-act="hide-ok">숨기기</button></div></div>`;
    return;
  }
  const hid=ROWS.find(r=>r[0]===m.row)[1].filter(k=>HIDDEN.has(k));
  el.innerHTML=`<div class="modal-box" role="dialog" aria-modal="true" aria-label="${m.row}에 재료 추가">
    <h3 class="hand">${m.row}에 재료 추가</h3>
    <div class="prev" id="ingPrev"></div>
    <label class="fld">이름<input type="text" id="ingName" maxlength="10" value="${esc(m.name)}" placeholder="예: 쑥갓" autocomplete="off"></label>
    <div class="fld">색<div class="swatches">${COLORS.map(c=>`<button class="sw" style="background:${c}" data-act="pick-color" data-c="${c}" aria-label="색 ${c}" aria-pressed="${c===m.c}"></button>`).join('')}</div></div>
    ${m.row===SIDE_ROW?`<label class="check"><input type="checkbox" id="ingPot" ${m.pot?'checked':''}> 냄비에 넣는 재료예요 (만두, 떡 같은 것)</label>`:''}
    <p class="login-err" id="ingErr" role="alert"></p>
    <div class="modal-btns"><button class="btn" data-act="modal-close">취소</button><button class="btn primary" data-act="add-ok">추가하기</button></div>
    ${hid.length?`<div class="hid"><div class="fld">숨긴 재료</div>${hid.map(k=>`<div class="hid-row"><span>${BY[k].label}</span><button class="chip" data-act="unhide" data-k="${k}">다시 꺼내기</button></div>`).join('')}</div>`:''}
  </div>`;
  const prev=()=>{const name=m.name.replace(/[<>&"']/g,'').trim()||'새 재료',tmp={name,[m.row==='육수'?'broth':'c']:m.c};
    $('#ingPrev').innerHTML=`<svg viewBox="0 0 100 100" aria-hidden="true">${ARTWRAP(NAMED_ART[name]||genArt(tmp))}</svg><span>${esc(name)}</span>`};
  prev();

// '야채로' / '버섯으로' 처럼 받침에 맞춰 조사 붙이기
const withRo=w=>{const c=w.charCodeAt(w.length-1)-0xAC00,j=c>=0&&c<11172?c%28:0;return w+(j&&j!==8?'으로':'로')};
const rowOf=k=>ROWS.find(r=>r[1].includes(k))[0];

/* =========================================================
   이벤트
   ========================================================= */
document.addEventListener('click',async e=>{
  if(S.modal){
    if(Date.now()-S.modal.t<400)return; // 꾹 누르기가 끝나는 순간의 터치가 창을 바로 닫지 않게
    if(e.target.id==='modal'){closeModal();return}
  }
  const day=e.target.closest('.day[data-date]');
  if(day){const k=day.dataset.date;S.date=k;
    if(S.records[k]){S.view='detail'}else{S.view='edit';S.draft={}}render();return}
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act;
  switch(act){
    case 'home':S.view='cal';if(S.date){const d=parseKey(S.date);S.month=new Date(d.getFullYear(),d.getMonth(),1)}render();break;
    case 'prev':S.month=new Date(S.month.getFullYear(),S.month.getMonth()-1,1);render();break;
    case 'next':S.month=new Date(S.month.getFullYear(),S.month.getMonth()+1,1);render();break;
    case 'new-today':S.date=keyOf(today);S.draft={};S.view='edit';render();break;
    case 'open-today':S.date=keyOf(today);S.view='detail';render();break;
    case 'save':{
      const rec={items:{...S.draft},saved:Date.now(),by:S.user.email};
      S.records[S.date]=rec;cloudSave(S.date,rec);
      S.view='detail';render();toast(navigator.onLine?'저장했어요':'저장했어요 · 인터넷이 연결되면 올라가요');break;}
    case 'edit':S.draft={...S.records[S.date].items};S.view='edit';render();break;
    case 'del':
      if(!S.armed){S.armed=true;a.classList.add('armed');a.textContent='한 번 더 누르면 삭제';
        clearTimeout(a._t);a._t=setTimeout(()=>{S.armed=false;a.classList.remove('armed');a.textContent='삭제'},2500);break}
      delete S.records[S.date];cloudDelete(S.date);
      S.view='cal';render();toast('삭제했어요');break;
    case 'signup':authDo('signup');break;
    case 'reset':authDo('reset');break;
    case 'logout':cloud.au.signOut(cloud.auth);break;
    case 'retry':location.reload();break;
    case 'add-ing':openModal({type:'add',row:a.dataset.row,name:'',c:COLORS[0],pot:true});break;
    case 'modal-close':closeModal();break;
    case 'pick-color':S.modal.c=a.dataset.c;renderModal();break;
    case 'add-ok':{
      const m=S.modal,name=m.name.replace(/[<>&"']/g,'').trim(),err=$('#ingErr');
      if(!name){err.textContent='이름을 적어주세요';break}
      const same=ING.find(i=>i.name===name||i.label===name);
      if(same){err.textContent=HIDDEN.has(same.k)?`숨긴 재료에 있어요. ${rowOf(same.k)}의 + 칸에서 다시 꺼내주세요`:'이미 있는 재료예요';break}
      const o={k:'x'+Date.now().toString(36),name,row:m.row,c:m.c};
      if(m.row===SIDE_ROW)o.pot=!!m.pot;
      closeModal();cloudIng({custom:cloud.fs.arrayUnion(o)});toast(`${name} 추가했어요`);break;}
    case 'move-ok':{const k=S.modal.k,row=a.dataset.row;closeModal();cloudIng({moved:{[k]:row}});toast(`${BY[k].label}, ${withRo(row)} 옮겼어요`);break;}
    case 'hide-ok':{const k=S.modal.k;closeModal();cloudIng({hidden:cloud.fs.arrayUnion(k)});toast(`${BY[k].label} 숨겼어요`);break;}
    case 'unhide':closeModal();cloudIng({hidden:cloud.fs.arrayRemove(a.dataset.k)});toast(`${BY[a.dataset.k].label} 다시 꺼냈어요`);break;
    case 'mode-pic':S.prefs.mode='pic';store.set('shabu-prefs',S.prefs);render();break;
    case 'mode-text':S.prefs.mode='text';store.set('shabu-prefs',S.prefs);render();break;
    case 'unused-outline':S.prefs.hideUnused=false;store.set('shabu-prefs',S.prefs);render();break;
    case 'unused-hide':S.prefs.hideUnused=true;store.set('shabu-prefs',S.prefs);render();break;
  }
});

/* =========================================================
   시작
   ========================================================= */
(async function init(){
  const pr=await store.get('shabu-prefs');if(pr)S.prefs={...S.prefs,...pr};
  S.view='loading';render();
  try{await cloudInit()}catch(e){console.error(e);S.view='offline';render()}
})();
</script>
</body>
